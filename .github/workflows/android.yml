name: Android build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project snapshot
        run: tar -xzf maomao-android-source.tar.gz --strip-components=1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: maomao-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
