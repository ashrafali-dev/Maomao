name: Android build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Termux bridge JavaScript
        run: |
          node --check android/app/src/main/assets/bridge.mjs
          node --check android/app/src/main/assets/memory-guard.cjs
      - name: Run Termux bridge integration smoke test
        run: node android/scripts/bridge-smoke.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - name: Run unit tests
        run: gradle -p android :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: maomao-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
